name: Release

# Push a tag like v1.0.0 to build the packages and publish a GitHub Release.
# "Run workflow" (manual) only builds them and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^project(QNotes VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != CMakeLists.txt version $version"; exit 1; }

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libpam0g-dev libxcb1-dev dpkg-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Package
        run: cd build && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: qnotes-linux
          path: build/*.deb

  windows:
    name: Windows (.zip + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: qnotes-windows
          path: |
            build/*.zip
            build/*.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
